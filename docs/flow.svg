<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
  <title id="t">How motabi runs a notebook's cells across sites</title>
  <desc id="d">A notebook's cells run in order from top to bottom. The first cells run at home. A cell that calls motabi.require(gpus=1) sends the kernel to a site with a GPU: the kernel is checkpointed and restored in a job there. Three independent cells after it run in parallel as copies of the kernel. Their results fold back into one kernel, which is checkpointed and returns home, where the remaining cells run.</desc>
  <style>
    svg {
      --bg: #ffffff; --band: #f6f8fa; --ink: #1f2328; --muted: #59636e; --cell: #d0d7de;
      --k: #1a7f64;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --band: #161b22; --ink: #e6edf3; --muted: #9198a1; --cell: #3d444d;
        --k: #3fb68b;
      }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: var(--ink); }
    .place { font-size: 16px; font-weight: 600; }
    .note { fill: var(--muted); }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; }
    .req { fill: var(--k); font-weight: 600; }
    .cell { fill: var(--bg); stroke: var(--cell); stroke-width: 1.2; }
    .a { fill: none; stroke: var(--k); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .ah { fill: var(--k); }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" rx="12" style="fill:var(--bg)"/>

  <!-- the two places -->
  <rect x="12" y="12" width="360" height="496" rx="10" style="fill:var(--band)"/>
  <rect x="384" y="12" width="604" height="496" rx="10" style="fill:var(--band)"/>
  <text class="place" x="40" y="44">Home</text>
  <text class="note" x="92" y="44">where you edit</text>
  <text class="place" x="412" y="44">Site</text>
  <text class="note" x="452" y="44">cluster or GPU node</text>

  <!-- cells at home -->
  <rect class="cell" x="40" y="68" width="304" height="40" rx="6"/>
  <text class="code" x="56" y="93">data = load("run42")</text>
  <rect class="cell" x="40" y="120" width="304" height="40" rx="6"/>
  <text class="code" x="56" y="145">clean = prep(data)</text>

  <!-- the requirement sends the kernel to the site -->
  <path class="a" d="M344,140 C420,140 450,208 520,208" marker-end="url(#h)"/>
  <rect class="cell" x="526" y="180" width="260" height="56" rx="6"/>
  <text class="code req" x="542" y="202">motabi.require(gpus=1)</text>
  <text class="code" x="542" y="224">model = train(clean)</text>
  <text class="note" x="802" y="198">this line sends the</text>
  <text class="note" x="802" y="217">kernel to a GPU site</text>

  <!-- independent cells run in parallel -->
  <path class="a" d="M656,236 V258 M476,258 H836"/>
  <path class="a" d="M476,258 V282" marker-end="url(#h)"/>
  <path class="a" d="M656,258 V282" marker-end="url(#h)"/>
  <path class="a" d="M836,258 V282" marker-end="url(#h)"/>
  <text class="note" x="852" y="257">independent cells</text>
  <text class="note" x="852" y="276">run in parallel</text>

  <rect class="cell" x="394" y="288" width="164" height="40" rx="6"/>
  <text class="code" x="406" y="313">a = test(model, 1)</text>
  <rect class="cell" x="574" y="288" width="164" height="40" rx="6"/>
  <text class="code" x="586" y="313">b = test(model, 2)</text>
  <rect class="cell" x="754" y="288" width="164" height="40" rx="6"/>
  <text class="code" x="766" y="313">c = test(model, 3)</text>

  <!-- fold into one kernel and return home -->
  <path class="a" d="M476,328 V352 M656,328 V352 M836,328 V352 M476,352 H836"/>
  <path class="a" d="M656,352 C656,404 480,420 350,420" marker-end="url(#h)"/>
  <text class="note" x="676" y="392">fold into one kernel,</text>
  <text class="note" x="676" y="411">checkpoint, return home</text>

  <!-- cells at home again -->
  <rect class="cell" x="40" y="400" width="304" height="40" rx="6"/>
  <text class="code" x="56" y="425">best = max(a, b, c)</text>
  <rect class="cell" x="40" y="452" width="304" height="40" rx="6"/>
  <text class="code" x="56" y="477">plot(best)</text>
</svg>
