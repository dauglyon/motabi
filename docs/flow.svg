<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
  <title id="t">How motabi moves a marimo kernel</title>
  <desc id="d">When a cell needs more than home can give, the kernel is checkpointed and restored in a job at a site. Independent cells run there as copies of the kernel, which fold back into one kernel. The kernel is then checkpointed and restored at home, where the session continues.</desc>
  <style>
    svg {
      --bg: #ffffff; --band: #f6f8fa; --ink: #1f2328; --muted: #59636e; --arrow: #6e7781;
      --k: #1a7f64; --k-bg: #e3f3ec;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --band: #161b22; --ink: #e6edf3; --muted: #9198a1; --arrow: #8b949e;
        --k: #3fb68b; --k-bg: #11261e;
      }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .place { font-size: 16px; font-weight: 600; }
    .note { fill: var(--muted); font-size: 15px; }
    .k { fill: var(--k-bg); stroke: var(--k); stroke-width: 1.5; }
    .kt { font-weight: 600; text-anchor: middle; }
    .a { fill: none; stroke: var(--arrow); stroke-width: 1.8; }
    .ah { fill: var(--arrow); }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="340" rx="12" style="fill:var(--bg)"/>

  <!-- the two places -->
  <rect x="12" y="12" width="976" height="96" rx="10" style="fill:var(--band)"/>
  <rect x="12" y="188" width="976" height="140" rx="10" style="fill:var(--band)"/>
  <text class="place" x="32" y="56">Home</text>
  <text class="note" x="32" y="78">where you edit</text>
  <text class="place" x="32" y="252">Site</text>
  <text class="note" x="32" y="274">cluster or GPU node</text>

  <!-- start at home -->
  <rect class="k" x="160" y="36" width="110" height="48" rx="8"/>
  <text class="kt" x="215" y="65">kernel</text>
  <text class="note" x="286" y="65">a cell needs a GPU</text>

  <!-- go to the site -->
  <path class="a" d="M215,84 C215,190 240,258 302,258"/>
  <path class="a" d="M290,258 H304" marker-end="url(#h)"/>
  <text class="note" x="232" y="140">checkpoint, restore</text>
  <text class="note" x="232" y="158">in a job at the site</text>

  <rect class="k" x="310" y="234" width="110" height="48" rx="8"/>
  <text class="kt" x="365" y="263">kernel</text>

  <!-- split into copies -->
  <path class="a" d="M420,258 C450,258 460,214 494,214" marker-end="url(#h)"/>
  <path class="a" d="M420,258 H494" marker-end="url(#h)"/>
  <path class="a" d="M420,258 C450,258 460,302 494,302" marker-end="url(#h)"/>
  <rect class="k" x="500" y="200" width="84" height="28" rx="7"/>
  <text class="kt" x="542" y="219">copy</text>
  <rect class="k" x="500" y="244" width="84" height="28" rx="7"/>
  <text class="kt" x="542" y="263">copy</text>
  <rect class="k" x="500" y="288" width="84" height="28" rx="7"/>
  <text class="kt" x="542" y="307">copy</text>
  <text class="note" x="436" y="140">independent cells</text>
  <text class="note" x="436" y="158">run at the same time</text>

  <!-- fold back into one -->
  <path class="a" d="M584,214 C618,214 628,258 658,258" marker-end="url(#h)"/>
  <path class="a" d="M584,258 H658" marker-end="url(#h)"/>
  <path class="a" d="M584,302 C618,302 628,258 658,258" marker-end="url(#h)"/>
  <rect class="k" x="664" y="234" width="110" height="48" rx="8"/>
  <text class="kt" x="719" y="263">kernel</text>
  <text class="note" x="600" y="140">their results fold</text>
  <text class="note" x="600" y="158">back into one kernel</text>

  <!-- come home -->
  <path class="a" d="M774,258 C836,258 860,190 860,90" marker-end="url(#h)"/>
  <text class="note" x="874" y="140">checkpoint,</text>
  <text class="note" x="874" y="158">return home</text>

  <rect class="k" x="805" y="36" width="110" height="48" rx="8"/>
  <text class="kt" x="860" y="65">kernel</text>
  <text class="note" x="789" y="65" text-anchor="end">the session continues</text>
</svg>
