<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">How motabi moves a marimo kernel</title>
  <desc id="d">A cell declares a requirement; after approval in the cell, the kernel's gVisor sandbox is checkpointed at home and restored inside a job at a site, where datasets are mounted by URI. Independent cells fork into workers restored from one checkpoint; their defines fold back into the root kernel by address, and the sandbox is checkpointed and restored at home again.</desc>
  <style>
    svg {
      --bg: #ffffff; --lane: #f6f8fa; --line: #d0d7de; --ink: #1f2328; --muted: #59636e;
      --kern: #1a7f64; --kern-bg: #e3f3ec; --move: #bc4c00; --move-bg: #fff1e5;
      --work: #8250df; --work-bg: #f3eefe; --link: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --lane: #161b22; --line: #30363d; --ink: #e6edf3; --muted: #9198a1;
        --kern: #3fb68b; --kern-bg: #11261e; --move: #f0883e; --move-bg: #2b1a0c;
        --work: #a371f7; --work-bg: #211a33; --link: #4493f8;
      }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
    .muted { fill: var(--muted); }
    .small { font-size: 10.5px; }
    .lab { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); }
    .bar { fill: var(--bg); stroke: var(--line); }
    .sandbox { fill: var(--kern-bg); stroke: var(--kern); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .worker { fill: var(--work-bg); stroke: var(--work); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .job { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
    .store { fill: var(--bg); stroke: var(--muted); stroke-width: 1.2; }
    .move { fill: none; stroke: var(--move); stroke-width: 2.2; }
    .fork { fill: none; stroke: var(--work); stroke-width: 1.6; }
    .link { fill: none; stroke: var(--link); stroke-width: 1.4; stroke-dasharray: 4 3; }
    .idle { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; }
    .data { fill: none; stroke: var(--muted); stroke-width: 1.4; }
    .chip { fill: var(--move-bg); stroke: var(--move); }
    .badge { fill: var(--move); }
    .badge-t { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .ah-move { fill: var(--move); } .ah-work { fill: var(--work); } .ah-link { fill: var(--link); } .ah-data { fill: var(--muted); }
  </style>
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-move" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-work" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-link" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-data" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="560" rx="12"/>

  <!-- Lanes -->
  <rect class="lane" x="12" y="12" width="976" height="80" rx="10"/>
  <rect class="lane" x="12" y="100" width="976" height="164" rx="10"/>
  <rect class="lane" x="12" y="272" width="976" height="276" rx="10"/>
  <text class="lab" x="28" y="48">Laptop</text>
  <text class="small muted" x="28" y="66">browser only</text>
  <text class="lab" x="28" y="132">Home</text>
  <text class="small muted" x="28" y="150">Linux, same ISA</text>
  <text class="small muted" x="28" y="165">as the sites</text>
  <text class="lab" x="28" y="304">Site</text>
  <text class="small muted" x="28" y="322">cluster or</text>
  <text class="small muted" x="28" y="337">GPU node</text>

  <!-- Laptop: editor with the approval prompt -->
  <rect class="bar" x="150" y="32" width="826" height="44" rx="8"/>
  <text class="muted" x="166" y="58">marimo editor</text>
  <rect class="chip" x="300" y="40" width="420" height="28" rx="6"/>
  <circle class="badge" cx="318" cy="54" r="9"/><text class="badge-t" x="318" y="58">2</text>
  <text x="336" y="58">Run on <tspan class="b">perlmutter</tspan>: 1 GPU, 2 h, queue ~10 min?</text>
  <text class="mono" x="682" y="58">[y]</text>

  <!-- Home: server, sandbox before and after -->
  <rect class="bar" x="150" y="114" width="826" height="34" rx="8"/>
  <text x="166" y="136">marimo server  ·  motabi orchestrator</text>
  <line class="data" x1="225" y1="160" x2="225" y2="148"/>

  <rect class="sandbox" x="150" y="160" width="150" height="76" rx="8"/>
  <text class="small muted" x="162" y="178">gVisor sandbox</text>
  <text class="b" x="162" y="200">kernel</text>
  <text class="mono" x="162" y="222">require(gpus=1)</text>
  <circle class="badge" cx="300" cy="160" r="9"/><text class="badge-t" x="300" y="164">1</text>

  <text class="small muted" x="664" y="200" text-anchor="middle" font-style="italic">the server keeps the session</text>
  <text class="small muted" x="664" y="215" text-anchor="middle" font-style="italic">while the kernel is away</text>

  <rect class="sandbox" x="862" y="160" width="114" height="76" rx="8"/>
  <text class="small muted" x="874" y="178">gVisor sandbox</text>
  <text class="b" x="874" y="200">kernel</text>
  <text class="small muted" x="874" y="222">back home</text>

  <!-- Site: job, root, workers -->
  <rect class="job" x="372" y="288" width="474" height="248" rx="10"/>
  <text class="small muted" x="834" y="526" text-anchor="end">one Slurm job · user namespaces only, no root</text>

  <rect class="sandbox" x="392" y="320" width="120" height="64" rx="8"/>
  <text class="b" x="404" y="346">root kernel</text>
  <text class="small muted" x="404" y="366">restored</text>

  <!-- tunnel back to the server -->
  <path class="link" d="M480,320 V152" marker-end="url(#al)"/>
  <text class="small" x="490" y="214" style="fill:var(--link)">ZeroMQ via</text>
  <text class="small" x="490" y="228" style="fill:var(--link)">the site's tunnel</text>

  <!-- root waits during the fork -->
  <path class="idle" d="M512,352 H730"/>
  <text class="small muted" x="610" y="345">root waits</text>
  <circle cx="544" cy="352" r="5" style="fill:var(--work)"/>

  <path class="fork" d="M544,352 C556,352 560,411 574,411" marker-end="url(#aw)"/>
  <path class="fork" d="M544,352 C556,352 560,451 574,451" marker-end="url(#aw)"/>
  <path class="fork" d="M544,352 C556,352 560,491 574,491" marker-end="url(#aw)"/>

  <rect class="worker" x="576" y="396" width="116" height="30" rx="7"/>
  <text class="small" x="588" y="415">worker 1 · cell A</text>
  <rect class="worker" x="576" y="436" width="116" height="30" rx="7"/>
  <text class="small" x="588" y="455">worker 2 · cell B</text>
  <rect class="worker" x="576" y="476" width="116" height="30" rx="7"/>
  <text class="small" x="588" y="495">worker 3 · cell C</text>

  <circle class="badge" cx="432" cy="432" r="9"/><text class="badge-t" x="432" y="436">5</text>
  <text class="small b" x="446" y="436">fork: N restores</text>
  <text class="small" x="446" y="451">of one checkpoint</text>

  <path class="fork" d="M692,411 C712,411 712,362 728,360" marker-end="url(#aw)"/>
  <path class="fork" d="M692,451 C716,451 714,370 728,370" marker-end="url(#aw)"/>
  <path class="fork" d="M692,491 C720,491 716,380 728,380" marker-end="url(#aw)"/>

  <rect class="sandbox" x="730" y="320" width="100" height="64" rx="8"/>
  <text class="b" x="742" y="346">root kernel</text>
  <text class="small muted" x="742" y="366">+ their defines</text>

  <circle class="badge" cx="742" cy="420" r="9"/><text class="badge-t" x="742" y="424">6</text>
  <text class="small b" x="756" y="424">fold</text>
  <text class="small" x="736" y="442">defines join the</text>
  <text class="small" x="736" y="457">root by address</text>

  <!-- datasets -->
  <path class="store" d="M168,412 V478 A66,10 0 0 0 300,478 V412"/>
  <ellipse class="store" cx="234" cy="412" rx="66" ry="10"/>
  <text class="b small" x="234" y="446" text-anchor="middle">dataset store</text>
  <text class="mono muted" x="234" y="463" text-anchor="middle">s3://lab/run42</text>
  <text class="small" x="234" y="510" text-anchor="middle">mounted at the site, by URI</text>
  <circle class="badge" cx="300" cy="404" r="9"/><text class="badge-t" x="300" y="408">4</text>
  <path class="data" d="M302,450 C350,450 404,436 404,390" marker-end="url(#ad)"/>

  <!-- migration out and back -->
  <path class="move" d="M225,236 V312 Q225,352 265,352 H386" marker-end="url(#am)"/>
  <circle class="badge" cx="248" cy="296" r="9"/><text class="badge-t" x="248" y="300">3</text>
  <text class="small" x="262" y="300">checkpoint, then</text>
  <text class="small" x="262" y="315">restore in a job</text>

  <path class="move" d="M780,320 V230 Q780,198 812,198 H856" marker-end="url(#am)"/>
  <circle class="badge" cx="796" cy="252" r="9"/><text class="badge-t" x="796" y="256">7</text>
  <text class="small" x="810" y="256">checkpoint, return home</text>
</svg>
